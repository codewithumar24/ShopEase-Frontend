<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Document</title>
</head>
<body>
<main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Add New Product</h1>
        <p class="text-gray-600 mb-8">Fill in the details for your new product</p>

        <div class="bg-white rounded-3xl shadow-sm p-8">
            <form>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Product Name</label>
                        <input type="text" class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:border-blue-500 outline-none" placeholder="Product name">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
                        <select class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:border-blue-500 outline-none">
                            <option>Electronics</option>
                            <option>Fashion</option>
                            <option>Home Appliances</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Price ($)</label>
                        <input type="number" step="0.01" class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:border-blue-500 outline-none" placeholder="99.99">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Stock Quantity</label>
                        <input type="number" class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:border-blue-500 outline-none" value="150">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">SKU</label>
                        <input type="text" class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:border-blue-500 outline-none" placeholder="PROD-39281">
                    </div>
                </div>

                <div class="mt-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                    <textarea rows="5" class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:border-blue-500 outline-none resize-none"></textarea>
                </div>

                <div class="mt-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Product Image</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-2xl p-8 text-center hover:border-blue-400 transition-colors">
                        <i class="fa-solid fa-cloud-arrow-up text-4xl text-gray-400 mb-3"></i>
                        <p class="text-gray-600">Click to upload image or drag & drop</p>
                    </div>
                </div>

                <div class="flex gap-4 mt-10">
                    <a href="" 
                       class="flex-1 py-4 text-center border border-gray-300 rounded-2xl font-semibold hover:bg-gray-50">
                        Cancel
                    </a>
                    <button type="submit" 
                            class="flex-1 py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-2xl font-semibold hover:scale-105 transition-all">
                        Create Product
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
