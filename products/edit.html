<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Document</title>
</head>
<body>
<main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Edit Product</h1>

        <div class="bg-white rounded-3xl shadow-sm p-8">
            <form>
                <!-- Same fields as create but with values -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Product Name</label>
                        <input type="text" value="Wireless Headphones Pro" 
                               class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:border-blue-500 outline-none">
                    </div>

                    <!-- Other fields same as create... -->

                </div>

                <div class="flex gap-4 mt-10">
                    <a href="#" class="flex-1 py-4 text-center border border-gray-300 rounded-2xl font-semibold hover:bg-gray-50">Cancel</a>
                    <button type="submit" class="flex-1 py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-2xl font-semibold hover:scale-105 transition-all">Update Product</button>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
