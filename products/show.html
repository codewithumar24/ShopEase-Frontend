<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Document</title>
</head>
<body>
<main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
    <div class="max-w-5xl mx-auto">
        <a href="#" class="inline-flex items-center gap-2 text-blue-600 mb-6 hover:underline">
            ← Back to Products
        </a>

        <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2">
                <!-- Image -->
                <div class="bg-gray-100 p-10 flex items-center justify-center">
                    <img src="https://picsum.photos/600/600" class="rounded-3xl shadow-xl max-w-full" alt="">
                </div>

                <!-- Details -->
                <div class="p-10">
                    <h1 class="text-4xl font-bold text-gray-800">Wireless Headphones Pro</h1>
                    <p class="text-2xl font-semibold text-blue-600 mt-2">$89.99</p>
                    
                    <div class="flex gap-3 mt-6">
                        <span class="bg-green-100 text-green-700 px-5 py-2 rounded-2xl text-sm font-medium">In Stock (243)</span>
                        <span class="bg-blue-100 text-blue-700 px-5 py-2 rounded-2xl text-sm font-medium">Electronics</span>
                    </div>

                    <div class="mt-8 border-t pt-8">
                        <h3 class="font-semibold mb-3">Description</h3>
                        <p class="text-gray-600 leading-relaxed">
                            Premium noise-cancelling wireless headphones with 30 hours battery life...
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
