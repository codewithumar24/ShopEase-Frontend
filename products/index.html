<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Document</title>
</head>
<body>
<main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
    <div class="mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Products</h1>
            <p class="text-gray-600">Manage all your store products</p>
        </div>
        <a href="#" 
           class="px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-semibold flex items-center gap-2 hover:scale-105 transition-all shadow-lg">
            <i class="fa-solid fa-plus"></i>
            <span>Add New Product</span>
        </a>
    </div>

    <!-- Search & Filter -->
    <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 flex flex-col md:flex-row gap-4">
        <div class="flex-1 relative">
            <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-400"></i>
            <input type="text" id="searchInput" 
                   placeholder="Search products..." 
                   class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
        </div>
        <select class="px-5 py-3 border border-gray-200 rounded-xl focus:outline-none">
            <option>All Categories</option>
            <option>Electronics</option>
            <option>Fashion</option>
            <option>Home & Kitchen</option>
        </select>
    </div>

    <!-- Products Table -->
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <table class="w-full">
            <thead>
                <tr class="border-b border-gray-100 bg-gray-50">
                    <th class="px-6 py-5 text-left">Product</th>
                    <th class="px-6 py-5 text-left">Category</th>
                    <th class="px-6 py-5 text-left">Price</th>
                    <th class="px-6 py-5 text-left">Stock</th>
                    <th class="px-6 py-5 text-left">Status</th>
                    <th class="px-6 py-5 text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="productTable" class="text-sm divide-y">
                <!-- Dummy Rows -->
                <tr class="hover:bg-gray-50 transition-colors table-row-hover">
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-4">
                            <img src="https://picsum.photos/60/60" class="w-12 h-12 rounded-xl object-cover" alt="">
                            <div>
                                <p class="font-semibold text-gray-800">Wireless Headphones Pro</p>
                                <p class="text-xs text-gray-500">SKU: WH-39281</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-5 text-gray-600">Electronics</td>
                    <td class="px-6 py-5 font-semibold text-gray-800">$89.99</td>
                    <td class="px-6 py-5">
                        <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">243 in stock</span>
                    </td>
                    <td class="px-6 py-5">
                        <span class="px-4 py-1.5 bg-green-100 text-green-700 rounded-full text-xs font-semibold">Active</span>
                    </td>
                    <td class="px-6 py-5 text-right space-x-4">
                        <a href="#" class="text-blue-600 hover:text-blue-800"><i class="fa-solid fa-eye"></i></a>
                        <a href="#" class="text-amber-600 hover:text-amber-800"><i class="fa-solid fa-pen"></i></a>
                        <button onclick="deleteProduct(this)" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>

                <!-- Repeat similar rows as needed -->
            </tbody>
        </table>
    </div>
</main>
<script>
function deleteProduct(btn) {
    if(confirm("Delete this product?")) {
        btn.closest('tr').remove();
    }
}

document.getElementById('searchInput').addEventListener('keyup', function() {
    const term = this.value.toLowerCase();
    document.querySelectorAll('#productTable tr').forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
    });
});
</script>

</body>
</html>
